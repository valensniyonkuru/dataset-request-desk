name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets deploy.yml run these same tests before it builds and deploys.
  workflow_call:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the tests, reachable on localhost:5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desk -d desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://desk:desk@localhost:5432/desk
      SECRET_KEY: ci-only-secret
      ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same order as the container: migrate first, so broken migrations fail CI.
      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
