name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets deploy.yml run these same tests before it builds and deploys.
  workflow_call:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the tests, reachable on localhost:5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desk -d desk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/conftest.py drops, recreates and migrates this database on every run.
      TEST_DATABASE_URL: postgresql+psycopg://desk:desk@localhost:5432/desk_test
      # At least 32 bytes: PyJWT warns about shorter HS256 keys.
      SECRET_KEY: ci-only-secret-at-least-32-bytes-long
      ENV: test
      # In CI the seed files are in the checkout, not at /app/seed as in the image.
      SEED_DIR: ${{ github.workspace }}/seed

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Migrations run inside the tests (conftest.py), so broken ones fail CI.
      - name: Run tests
        run: pytest -v
