# Keep the original scheme when a proxy in front of us (the host nginx doing
# HTTPS) already set X-Forwarded-Proto; otherwise use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow request bodies (e.g. CSV uploads) up to 20 MB.
    client_max_body_size 20m;

    # API. The trailing "/" in proxy_pass replaces the matched "/api/" with "/",
    # so /api/health reaches the backend as /health.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Single-page app: serve the file if it exists, otherwise index.html,
    # so a page refresh on a client-side route still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
